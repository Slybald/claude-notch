name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Appelée par release.yml : une version n'est publiée qu'après une CI verte sur son commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
